name: Probe

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Trigger probes
        env:
          PROBE_URL: ${{ secrets.PROBE_URL }}
          PROBE_URL_AWS_ICN: ${{ secrets.PROBE_URL_AWS_ICN }}
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: |
          set -euo pipefail
          test -n "${PROBE_SECRET}"
          urls=()
          if [ -n "${PROBE_URL:-}" ]; then urls+=("${PROBE_URL}"); fi
          if [ -n "${PROBE_URL_AWS_ICN:-}" ]; then urls+=("${PROBE_URL_AWS_ICN}"); fi
          test "${#urls[@]}" -gt 0

          mkdir -p /tmp/probes
          rm -f /tmp/probes/*.json
          i=0
          pids=()
          set +e
          for url in "${urls[@]}"; do
            curl -fsS --max-time 180 -X POST "${url}" \
              -H "Authorization: Bearer ${PROBE_SECRET}" \
              -H "Accept: application/json" \
              -o "/tmp/probes/${i}.json" &
            pids+=($!)
            i=$((i + 1))
          done
          fail=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || fail=1
          done
          set -e
          test -n "$(ls -A /tmp/probes/*.json 2>/dev/null)"
          python3 - <<'PY'
          import json, glob, os
          froms = {}
          at = None
          for path in sorted(glob.glob("/tmp/probes/*.json")):
              raw = json.load(open(path))
              if not isinstance(raw, dict):
                  continue
              if isinstance(raw.get("from"), dict):
                  for key, col in raw["from"].items():
                      if isinstance(col, dict):
                          froms[key] = col
                          at = col.get("at") or at
              elif "probe" in raw:
                  probe = raw.get("probe") or {}
                  key = probe.get("id") or os.path.basename(path)
                  froms[key] = {**probe, "results": raw.get("results") or []}
                  at = probe.get("at") or at
          if not froms:
              raise SystemExit("no probe columns")
          json.dump({"at": at, "from": froms}, open("/tmp/latest.json", "w"), separators=(",", ":"))
          PY
          if [ "$fail" -ne 0 ]; then
            echo "one or more probes failed; published $(python3 -c 'import json; print(len(json.load(open("/tmp/latest.json"))["from"]))') column(s)" >&2
          fi

      - name: Publish status branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch status "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status-out \
            || git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status-out
          cd status-out
          if ! git show-ref --verify --quiet refs/heads/status && ! git show-ref --verify --quiet refs/remotes/origin/status; then
            git checkout --orphan status
            git rm -rf . >/dev/null 2>&1 || true
          else
            git checkout status 2>/dev/null || git checkout -b status origin/status
          fi
          cp /tmp/latest.json latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "probe $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0
          git push --force origin HEAD:status
